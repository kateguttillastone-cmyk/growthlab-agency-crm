# Développement.
#   Base seule (pour `pnpm dev:api` et `pnpm dev:web`) : docker compose up -d postgres
#   Pile complète en conteneurs                         : docker compose up --build
#     Interface http://localhost:8080 · API (direct) http://localhost:3001/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gac
      POSTGRES_PASSWORD: gac
      POSTGRES_DB: gac
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # -h 127.0.0.1 : test par le réseau (TCP). Sans lui, pg_isready répond via le socket local, que le serveur
    # TEMPORAIRE de l'initialisation (premier démarrage) accepte déjà : l'API démarrait alors trop tôt.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gac -d gac"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    # l'API attend aussi la base par elle-même (jusqu'à DB_WAIT_SECONDS) ; ceci la relance si elle tombe malgré tout
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://gac:gac@postgres:5432/gac
      APP_ORIGIN: http://localhost:8080
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gac.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Please-123}
      SWAGGER: "true"
      COOKIE_SECURE: "false"
      PORT: 3001
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports: ["3001:3001"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: on-failure
    # nginx résout « api » au démarrage : il ne doit démarrer que lorsque l'API répond
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:8080"]

volumes:
  pgdata:
