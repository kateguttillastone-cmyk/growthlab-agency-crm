# Développement.
#   Base seule (pour `pnpm dev:api` et `pnpm dev:web`) : docker compose up -d postgres
#   Pile complète en conteneurs                         : docker compose up --build
#     Interface http://localhost:8080 · API (direct) http://localhost:3001/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gac
      POSTGRES_PASSWORD: gac
      POSTGRES_DB: gac
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gac"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://gac:gac@postgres:5432/gac
      APP_ORIGIN: http://localhost:8080
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gac.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Please-123}
      SWAGGER: "true"
      COOKIE_SECURE: "false"
      PORT: 3001
    ports: ["3001:3001"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:8080"]

volumes:
  pgdata:
